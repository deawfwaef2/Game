<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>闭门365 · 离线可玩版</title><style>*{box-sizing:border-box}body{margin:0;background:#161b18;color:#e2dfd1;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1050px;margin:auto;padding:40px 24px}small{letter-spacing:3px;color:#9b9f88}h1{font-size:64px;line-height:1;margin:22px 0}h1 b{color:#ca8d50}section{background:#232b24;padding:24px;border:1px solid #465043;margin:20px 0;border-radius:6px}button,input{font:inherit;border:1px solid #64705b;padding:12px 18px;background:#303d30;color:#e5e5d6;border-radius:4px;margin:5px;cursor:pointer}button:hover{background:#536346}button.primary{background:#b9834a;color:#171d16;border:0;font-weight:700}.row{display:flex;gap:20px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}progress{width:100%;accent-color:#b0b98a}.room{height:220px;position:relative;background:linear-gradient(90deg,#3b4436 48%,#414c3c 48%);border-bottom:35px solid #766650;overflow:hidden}.room:before{content:'▦';position:absolute;right:15%;top:15px;background:#53605a;border:10px solid #222e25;width:130px;height:120px;font-size:100px;line-height:110px;text-align:center;color:#9da48c}.room:after{content:'你的房间 · 高层公寓';position:absolute;left:20px;bottom:15px;background:#897b62;border:14px solid #3b352b;padding:12px 30px;color:#ded6ba}#log{max-height:180px;overflow:auto;font-size:13px;color:#a9b59b}.hint{color:#a9ac98;font-size:12px}#game{display:none}</style><main><small>安德士帝国 / 1986 / 离线生存原型 v0.0.1</small><h1>闭门 <b>365</b></h1><p>你与家人告别，带着 300 帝国纸币躲进无人知晓的公寓。<br>街头的通缉画像还没褪色。门外不安全。你决定，活着等过这一年。</p><section id="menu"><label>房间种子 <input id="seed" value="ANDERS-1986"></label><p>基础补给：20 份干粮，2 本旧书。水龙头仍然可用。<br>这是优先保存的基础版本，后续将替换为自包含的第一人称 3D 版本。</p><button class="primary" onclick="start()">开始游戏 →</button></section><div id="game"><div class="room"></div><section><div class="row"><h2 id="date">第 1 / 365 天</h2><p id="money"></p></div><div class="row" id="stats"></div><p class="hint">饱腹、饮水、体力、精神越高越好；危险时跳时会停止。精神或健康耗尽失败。</p><button onclick="act('eat')">吃一份干粮 · 15 分钟</button><button onclick="act('water')">接水喝 · 5 分钟</button><button onclick="act('toilet')">上厕所 · 10 分钟</button><button onclick="act('read')">读书 · 2 小时</button><button onclick="act('sleep')">睡觉 · 6 小时</button><button onclick="act('clean')">整理房间 · 30 分钟</button><button onclick="act('buy')">匿名买 10 份干粮 · $8</button><button onclick="save()">保存</button><button onclick="location.reload()">主菜单</button></section><section><b>房间手记</b><div id="log"></div></section></div></main><script>let s={hours:8,food:85,water:85,energy:85,mood:85,health:100,cash:300,rations:20,dead:false};let history=[];function start(){document.querySelector('#menu').style.display='none';document.querySelector('#game').style.display='block';try{const x=JSON.parse(localStorage.getItem('closed365-v001'));if(x)s=x}catch{}log('门锁落下。你的 365 天，从现在开始。');render()}function log(t){history.unshift(t);document.querySelector('#log').innerHTML=history.slice(0,15).map(x=>'<p>'+x+'</p>').join('')}function advance(h,sleep=false){for(let i=0;i<h*4;i++){s.hours+=.25;s.food-=.7;s.water-=1.1;s.energy+=sleep?2.6:-.6;s.mood-=sleep?.04:.1;if(s.food<12||s.water<12){s.health-=.8;s.mood-=.5}if(s.energy<5)s.health-=.5;for(let k of ['food','water','energy','mood','health'])s[k]=Math.max(0,Math.min(100,s[k]));if(!s.health||!s.mood){s.dead=true;log('你没能等到门外平静。生存失败。');break}if(s.hours>=365*24){s.dead=true;log('你活过了 365 天。风声终于过去。你胜利了。');break}if((s.food<8||s.water<8)&&h>1){log('跳时中断：先照顾好饥饿和口渴。');break}}}function act(a){if(s.dead)return;if(a==='eat'){if(!s.rations)return log('干粮已经用完。');s.rations--;advance(.25);s.food=Math.min(100,s.food+40);log('你慢慢吃完一份干粮。')}if(a==='water'){advance(.1);s.water=100;log('杯子里是干净的自来水。')}if(a==='toilet'){advance(.2);s.mood=Math.min(100,s.mood+2);log('你处理完个人需要，洗了手。')}if(a==='read'){advance(2);s.mood=Math.min(100,s.mood+15);log('书页把窗外的纷扰隔开了一会儿。')}if(a==='sleep'){advance(6,true);log('你睡了一觉，门外暂时没有动静。')}if(a==='clean'){advance(.5);s.mood=Math.min(100,s.mood+8);log('房间更整洁了。')}if(a==='buy'){if(s.cash<8)return log('纸币不够了。');s.cash-=8;s.rations+=10;log('旧电台暗号换来了 10 份干粮。')}render();save(false)}function render(){document.querySelector('#date').textContent='第 '+(Math.floor(s.hours/24)+1)+' / 365 天 · '+String(Math.floor(s.hours%24)).padStart(2,'0')+':00';document.querySelector('#money').textContent='帝国纸币 $'+s.cash+' · 干粮 '+s.rations+' 份';document.querySelector('#stats').innerHTML=Object.entries({food:'饱腹',water:'饮水',energy:'体力',mood:'精神',health:'健康'}).map(([k,v])=>'<div>'+v+' '+Math.round(s[k])+'<progress max="100" value="'+s[k]+'"></progress></div>').join('')}function save(t=true){try{localStorage.setItem('closed365-v001',JSON.stringify(s));if(t)log('已保存。')}catch{if(t)log('当前预览禁止本地存储，本轮仍可继续游玩。')}}</script></html>
